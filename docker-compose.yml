services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_strong_Passw0rd}
    ports: ["1434:1433"]
    volumes: [sqldata:/var/opt/mssql]

  web:
    build: ./src/SportBooking.Web
    depends_on: [db]
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=SportBooking;User Id=sa;Password=${SA_PASSWORD:-Your_strong_Passw0rd};TrustServerCertificate=True"
      TZ: Asia/Ho_Chi_Minh
      Email__User: ${SMTP_USER:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Payment__Bank__BankName: ${BANK_NAME:-}
      Payment__Bank__BankBin: ${BANK_BIN:-}
      Payment__Bank__AccountNumber: ${BANK_ACCOUNT_NUMBER:-}
      Payment__Bank__AccountName: ${BANK_ACCOUNT_NAME:-}
      Payment__Bank__QrImage: ${BANK_QR_IMAGE:-}
    ports: ["8080:8080"]
    volumes: [avatars:/app/wwwroot/uploads]

volumes:
  sqldata:
  avatars:
